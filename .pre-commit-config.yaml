# Without this, `pre-commit install` wires ONLY the pre-commit hook, so `git push`
# runs nothing and every hook staged pre-push is silently dead code.
default_install_hook_types: [pre-commit, pre-push]
# Phase 0 dev-velocity contract (graph-os-completion-program): a hook with no
# explicit `stages:` below is commit-only, never both.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # v4.4.0
    hooks:
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: okf-no-legacy-concepts
        name: OKF-CIS — no legacy CONCEPT ids
        entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else d="$repo"; root=""; while [ "$d" != "/" ]; do if [ -d "$d/agent-connector-sdk/scripts" ]; then root="$d/agent-connector-sdk"; break; fi; d=$(dirname "$d"); done; fi; if [ ! -d "$root/scripts" ]; then echo "REFUSED - cannot locate agent-connector-sdk/scripts from $repo (set AGENT_UTILITIES_ROOT)" >&2; exit 1; fi; python3 "$root/scripts/check_no_legacy_markers.py" . "$@"' --
        language: system
        pass_filenames: false
        always_run: true
      - id: env-var-drift
        name: check env-var/config drift
        entry: bash -c 'if [ -f uv.lock ]; then uv run python -m agent_connector_sdk.mcp.env_drift --check; else python -m agent_connector_sdk.mcp.env_drift --check; fi'
        language: system
        pass_filenames: false
        files: ^(README\.md|\.env\.example|mcp_config.*\.json|.*/mcp_config.*\.json|docker/.*compose.*\.ya?ml|.*/auth\.py|.*/mcp_server\.py)$
  - repo: https://github.com/Knuckles-Team/pipelines
    rev: ed8ea8ac5989cbc883c149843b311aeecb44e6a2
    hooks:
    - id: dependency-readiness
