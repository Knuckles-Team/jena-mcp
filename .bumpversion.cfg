[bumpversion]
current_version = 2.3.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(dockerpin0):docker/Dockerfile]
search = jena-mcp[mcp]=={current_version}
replace = jena-mcp[mcp]=={new_version}

[bumpversion:file:jena_mcp/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:jena_mcp/api_client.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:jena_mcp/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
